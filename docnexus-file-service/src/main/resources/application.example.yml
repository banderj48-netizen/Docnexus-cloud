server:
  port: ${FILE_SERVICE_PORT:8102}

spring:
  application:
    name: docnexus-file-service
  servlet:
    multipart:
      max-file-size: ${FILE_MULTIPART_MAX_FILE_SIZE:110MB}
      max-request-size: ${FILE_MULTIPART_MAX_REQUEST_SIZE:120MB}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/docnexus_cloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:change-me}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_FILE_PRODUCER_GROUP:docnexus-file-producer-group}
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.xyf.docnexus.file: info
    com.xyf.docnexus.file.mapper: debug
    org.mybatis: debug

docnexus:
  file:
    # 文件二进制进入 MinIO，MySQL 只保存元数据、上传会话、分片和解析任务状态。
    # 生产环境必须通过环境变量或 Secret 注入访问密钥。
    minio:
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:change-me}
      secret-key: ${MINIO_SECRET_KEY:change-me}
      original-bucket: ${MINIO_ORIGINAL_BUCKET:docnexus-original-files}
      temp-bucket: ${MINIO_TEMP_BUCKET:docnexus-upload-temp}
    # 100MB 内走普通上传，100MB 到 200MB 走分片上传，默认每片 10MB。
    upload:
      max-size-bytes: ${FILE_UPLOAD_MAX_SIZE_BYTES:209715200}
      multipart-threshold-bytes: ${FILE_UPLOAD_MULTIPART_THRESHOLD_BYTES:104857600}
      chunk-size-bytes: ${FILE_UPLOAD_CHUNK_SIZE_BYTES:10485760}
      session-expire-hours: ${FILE_UPLOAD_SESSION_EXPIRE_HOURS:24}
    # 文档库列表 Redis 版本号缓存：空列表缓存防穿透，短锁防击穿，TTL 抖动防雪崩。
    cache:
      library-base-ttl-seconds: ${FILE_LIBRARY_CACHE_BASE_TTL_SECONDS:7200}
      library-empty-ttl-seconds: ${FILE_LIBRARY_CACHE_EMPTY_TTL_SECONDS:300}
      library-jitter-seconds: ${FILE_LIBRARY_CACHE_JITTER_SECONDS:900}
      library-version-ttl-seconds: ${FILE_LIBRARY_CACHE_VERSION_TTL_SECONDS:86400}
      lock-ttl-seconds: ${FILE_LIBRARY_CACHE_LOCK_TTL_SECONDS:5}
      lock-wait-millis: ${FILE_LIBRARY_CACHE_LOCK_WAIT_MILLIS:80}
      lock-wait-attempts: ${FILE_LIBRARY_CACHE_LOCK_WAIT_ATTEMPTS:8}
