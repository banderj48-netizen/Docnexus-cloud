# 本机 Windows frpc 配置补充示例。
# 如果你已经有 frpc.ini，不要整文件覆盖，只需要追加 docnexus-frontend-dev 这一段。

[common]
server_addr = 请替换为阿里云服务器公网IP
server_port = 7000
token = 请替换为已有_frp_token

# 前端开发服务转发：外部访问 http://阿里云公网IP:18173，会转发到本机 http://127.0.0.1:5173。
[docnexus-frontend-dev]
type = tcp
local_ip = 127.0.0.1
local_port = 5173
remote_port = 18173
use_encryption = true
use_compression = true
